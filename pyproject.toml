[project]
name = "time-topology"
version = "0.1.0"
description = "Calendar for energy/context switching — open-source toolkit by zAx4hub."
authors = [{ name = "zAx4hub", email = "zAx4hub@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
time-topology = "time_topology.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
